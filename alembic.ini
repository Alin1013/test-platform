# 测试平台的单数据库迁移配置。

[alembic]
# 迁移脚本路径相对于当前配置文件解析。
script_location = %(here)s/backend/migrations
# 将仓库根目录加入模块搜索路径，以便迁移环境导入 backend 包。
prepend_sys_path = .
# 使用当前操作系统的路径分隔符解析列表配置。
path_separator = os
# 默认使用本地 SQLite；env.py 会优先读取 DATABASE_URL 环境变量。
sqlalchemy.url = sqlite:///backend/test_platform.db

# 以下日志配置由迁移环境加载。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
